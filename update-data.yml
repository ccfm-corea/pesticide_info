name: 농약정보 갱신

on:
  schedule:
    - cron: "0 20 * * *"   # 매일 05:00 (한국시간) — UTC 20:00
  workflow_dispatch:        # 저장소 Actions 탭에서 손으로도 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 농약등록정보 수집
        env:
          PSIS_API_KEY: ${{ secrets.PSIS_API_KEY }}
          # 매뉴얼 확인 후 아래 값이 다르면 Variables 로 덮어쓸 수 있습니다
          PSIS_SVC_REGISTER: ${{ vars.PSIS_SVC_REGISTER }}
          PSIS_SVC_CANCELLED: ${{ vars.PSIS_SVC_CANCELLED }}
        run: python3 scripts/build_data.py build

      - name: 바뀐 내용 반영
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "변경 없음"; exit 0
          fi
          git config user.name  "gano-bot"
          git config user.email "gano-bot@users.noreply.github.com"
          git add data
          git commit -m "농약정보 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
